name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Permisos mínimos: el workflow solo necesita leer el contenido del repositorio.
permissions:
  contents: read

# Un commit nuevo en la misma rama o pull request cancela la ejecución anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Si un sistema falla, el otro termina igualmente su ejecución.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Los comandos son los documentados en CONTRIBUTING.md, en el mismo orden.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Test e2e (API)
        run: npm run test:e2e -w @pantrymind/api

      - name: Build
        run: npm run build
